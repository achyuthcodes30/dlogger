input {
  kafka {
    bootstrap_servers => "159.223.32.50:9092"
    topics => ["elasticsearch"]
    codec => json
  }
}

filter {
  if [message_type] == "LOG" {
    if [log_level] == "INFO" {
      mutate {
        add_field => { "[@metadata][target_index]" => "info-logs" }
      }
    }
    else if [log_level] == "ERROR" {
      mutate {
        add_field => { "[@metadata][target_index]" => "error-logs" }
      }
    }
    else if [log_level] == "WARN" {
      mutate {
        add_field => { "[@metadata][target_index]" => "warn-logs" }
      }
    }
  }
  else if [message_type] == "REGISTRATION" {
    mutate {
      add_field => { 
        "[@metadata][target_index]" => "registry" 
        "status" => "UP"
        }
    }
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    document_id => "%{[log_id]}"
  }
}
