<source>
  @type tail
  path /var/log/nanoservices.log
  pos_file /var/log/fluentd/python-service.pos
  tag python.service.logs
  <parse>
    @type json
  </parse>
  read_from_head true
</source>

# Route 'REGISTRATION' and 'HEARTBEAT' to the 'alive' Kafka topic
<filter python.service.logs>
  @type grep
  <regexp>
    key message_type
    pattern (REGISTRATION|HEARTBEAT)
  </regexp>
  add_tag_prefix alive.
</filter>

# Route 'WARN' and 'ERROR' logs to the 'alerting' Kafka topic
<filter python.service.logs>
  @type grep
  <regexp>
    key log_level
    pattern (WARN|ERROR)
  </regexp>
  add_tag_prefix alerting.
</filter>

# Route everything to the 'archival' Kafka topic
<filter python.service.logs>
  @type record_transformer
  enable_ruby true
  <record>
    archival_tag "true"
  </record>
  add_tag_prefix archival.
</filter>

# Forward 'alive' logs to the 'alive' Kafka topic
<match alive.**>
  @type kafka2
  brokers 159.223.32.50:9092
  topic alive
  <format>
    @type json
  </format>
  use_event_time true
</match>

# Forward 'alerting' logs to the 'alerting' Kafka topic
<match alerting.**>
  @type kafka2
  brokers 159.223.32.50:9092
  topic alerting
  <format>
    @type json
  </format>
  use_event_time true
</match>

# Forward everything to the 'archival' Kafka topic
<match archival.**>
  @type kafka2
  brokers 159.223.32.50:9092
  topic archival
  <format>
    @type json
  </format>
  use_event_time true
</match>
