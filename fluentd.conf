<source>
  @type tail
  path /var/log/nanoservices.log
  pos_file /var/log/fluentd/python-service.pos
  tag python.service
  <parse>
    @type json
  </parse>
  read_from_head true
  emit_unmatched_lines true
</source>

<match python.service>
  @type rewrite_tag_filter
  <rule>
    key message_type
    pattern ^REGISTRATION$
    tag registration
  </rule>
  <rule>
    key message_type
    pattern ^HEARTBEAT$
    tag heartbeat
  </rule>
  <rule>
    key message_type
    pattern ^LOG$
    tag python.service.log # Temporary tag
  </rule>
</match>

<match python.service.log> # Process LOG messages further
  @type rewrite_tag_filter
  <rule>
    key log_level
    pattern ^INFO$
    tag info_log
  </rule>
  <rule>
    key log_level
    pattern ^WARN$
    tag warn_log
  </rule>
  <rule>
    key log_level
    pattern ^ERROR$
    tag error_log
  </rule>
</match>

<match registration heartbeat>
  @type kafka2
  brokers 159.223.32.50:9092
  topic alive
  <format>
    @type json
  </format>
  <buffer>
    flush_interval 1
  </buffer>
  use_event_time true
</match>


<match warn_log error_log>
  @type kafka2
  brokers 159.223.32.50:9092
  topic alerting
  <format>
    @type json
  </format>
  <buffer>
    flush_interval 1
  </buffer>
  use_event_time true
</match>

<match info_log>
  @type kafka2
  brokers 159.223.32.50:9092
  topic info
  <format>
    @type json
  </format>
  <buffer>
    flush_interval 1
  </buffer>
  use_event_time true
</match>
